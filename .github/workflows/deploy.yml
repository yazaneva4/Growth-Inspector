name: Deploy to Vercel

# Vercel Git integration already deploys pushes to the connected production branch.
# This manual workflow is for a deliberate, separately approved rebuild.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.ENABLE_VERCEL_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate required configuration
        run: |
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID repository variable}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_PROJECT_ID repository variable}"
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN repository secret}"
          : "${VERCEL_CLI_VERSION:?Missing pinned VERCEL_CLI_VERSION repository variable}"
      - name: Install verified CLI version
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Pull project settings
        run: vercel pull --yes --environment=production
      - name: Build
        run: vercel build --prod
      - name: Stage production build without changing live domains
        run: vercel deploy --prebuilt --prod --skip-domain
