name: Stage Vercel rebuild

# Git integration deploys the production branch. Manual runs stage a rebuild
# for inspection without moving live domains.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.ENABLE_VERCEL_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      # Each value may live in repo variables (Settings → Secrets and
      # variables → Actions → Variables) or in repo secrets — the documented
      # setup and a secrets-only setup both work.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: ${{ secrets.VERCEL_CLI_VERSION || vars.VERCEL_CLI_VERSION }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate configuration
        run: |
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID — add it as a repo variable or secret}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_PROJECT_ID — add it as a repo variable or secret}"
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Set an exact VERCEL_CLI_VERSION (repo variable or secret), e.g. the version 'vercel --version' prints locally"; exit 1; }
      - name: Install pinned CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Pull production settings
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod
      - name: Stage without changing live domains
        run: vercel deploy --prebuilt --prod --skip-domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
