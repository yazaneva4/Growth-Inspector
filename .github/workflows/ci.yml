name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-realtime-tables.mjs
      - run: npm test
      - run: npx eslint src --max-warnings=0
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ttjzmmqalbfeybysmqko.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_LztXbrEa4Evw12Iehs4H5A_ivQU-ZOz
