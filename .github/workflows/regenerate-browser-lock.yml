name: Regenerate headless browser lockfile

on:
  push:
    branches:
      - feature/growth-ai-ui-headless-browser
    paths:
      - package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/growth-ai-ui-headless-browser
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Update npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "Update lockfile for headless browser"
            git push origin HEAD:feature/growth-ai-ui-headless-browser
          fi
